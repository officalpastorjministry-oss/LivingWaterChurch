#sidebar .brand img{width:48px;height:48px;border-radius:12px;background:#0e254d;object-fit:cover}
#sidebar button.nav{width:100%;text-align:left;background:transparent;border:0;color:#a9c8ff;padding:12px 12px;border-radius:12px;cursor:pointer;font-size:15px;display:flex;gap:8px;margin:2px 0}
#sidebar button.nav.active{background:rgba(255,255,255,.14);color:#fff}
#main{margin-left:260px;flex:1;padding:18px;background:linear-gradient(135deg,#0e254d,#1e90ff);min-height:100vh}
.card{background:#fff;border-radius:18px;padding:16px;max-width:860px;margin:0 auto 14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.bday{background:#fff3a6;border:2px solid #ffb300;border-radius:14px;padding:12px;text-align:center;font-weight:800;max-width:860px;margin:0 auto 14px}
input,textarea{width:100%;padding:12px;border:1px solid #d0d7e3;border-radius:12px;margin:6px 0}
.btn{background:#0e4f8c;color:#fff;border:0;padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer;width:100%;margin-top:6px}
.btn2{background:#eef4ff;color:#0e4f8c;border:0;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600;width:100%;margin:4px 0}
.verse{display:flex;gap:10px;padding:10px 8px;border-bottom:1px solid #eef0f4}
.verse.hl{background:#fff59d;border-radius:8px}
.chip{background:#eef4ff;color:#0e4f8c;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;margin:2px}
#hamb{display:none;position:fixed;top:12px;left:12px;z-index:30;background:#08162e;color:#fff;border:0;padding:10px 14px;border-radius:12px}
@media(max-width:900px){#sidebar{transform:translateX(-100%);transition:.28s}#sidebar.open{transform:translateX(0)}#main{margin-left:0;padding-top:60px}#hamb{display:block}}
</style>

function doEnter(){const fn=document.getElementById('fName').value.trim(),ln=document.getElementById('lName').value.trim(),em=document.getElementById('email').value.trim(),dobRaw=document.getElementById('dob').value.trim();if(!fn||!em||!dobRaw){alert('Fill First Name, Email, DOB');return;}let dob=dobRaw;if(dobRaw.includes('/')){const p=dobRaw.split('/');if(p.length===3){let m=p[0].padStart(2,'0'),d=p[1].padStart(2,'0'),y=p[2];if(y.length===2)y=(parseInt(y)>30?'19':'20')+y;dob=y+'-'+m+'-'+d;}}currentUser={firstName:fn,lastName:ln,email:em,dob:dob};safeSet('currentUser',currentUser);checkBday();renderHome();}
function renderHome(){checkBday();let html="";if(sermon&&sermon.title){html+="<div class='card'><h3>This Week's Sermon</h3>";if(sermon.image)html+="<img src='"+sermon.image+"' style='width:100%;border-radius:14px;max-height:360px;object-fit:cover;margin-bottom:10px'>";html+="<h3>"+(sermon.title||'')+"</h3><p><b>"+(sermon.scripture||'')+"</b></p><p>"+(sermon.desc||'')+"</p><button class='btn2' onclick='openSermon()'>Pastor Update (PastorJ2026)</button></div>";}else{html+="<div class='card'><h3>This Week's Sermon</h3><p>No sermon yet.</p><button class='btn2' onclick='openSermon()'>Pastor Update (PastorJ2026)</button></div>";}html+="<div class='card'><h3>Sunday Service — 7:00 PM Central</h3><p>Welcome Home, "+(currentUser?currentUser.firstName:'Friend')+"!</p><div style='display:flex;gap:8px'><button class='btn2' onclick='go("bible")'>📖 Bible</button><button class='btn2' onclick='go("share")'>🔗 Share/QR</button></div></div>";html+="<div id='sermonBox' style='display:none' class='card'><h3>Upload Sermon — Auto Shrinks Any Photo</h3><input id='sTitle' placeholder='Title'><input id='sScript' placeholder='Scripture'><textarea id='sDesc' placeholder='Description'></textarea><input type='file' id='sImg' accept='image/*'><input type='password' id='sPwd' placeholder='PastorJ2026'><button class='btn' onclick='saveSermon()'>Save (auto-shrink)</button></div>";document.getElementById('content').innerHTML=html;}
function openSermon(){const pwd=prompt('Pastor password:');if(pwd==='PastorJ2026')document.getElementById('sermonBox').style.display='block';else if(pwd!==null)alert('Wrong password');}
function compressImage(file,maxW,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=ev.target.result;};r.onerror=rej;r.readAsDataURL(file);});}
async function saveSermon(){if(document.getElementById('sPwd').value!=='PastorJ2026'){alert('Wrong');return;}const t=document.getElementById('sTitle').value,s=document.getElementById('sScript').value,d=document.getElementById('sDesc').value,f=document.getElementById('sImg').files[0];let img='';if(f){img=await compressImage(f,900,0.72);}sermon={title:t,scripture:s,desc:d,image:img,date:new Date().toISOString()};safeSet('weeklySermon',sermon);alert('Saved! Image auto-shrunk to '+Math.round(img.length/1024)+'KB');renderHome();}
function renderBible(){let h="<div class='card'><h3>🔍 Bible Search — jumps to verse</h3><div style='display:flex;gap:6px'><input id='bSearch' placeholder='love, John 3:16' style='flex:1'><button class='btn2' style='width:auto' onclick='doSearch()'>Search</button></div><div id='bRes'></div></div><div class='card'><h3>📖 66 Books</h3><div style='display:flex;flex-wrap:wrap;gap:6px'>";BOOKS.forEach(b=>{h+="<button class='btn2' style='width:auto' onclick='openBook(""+b+"")'>"+b+"</button>";});h+="</div></div><div id='bDetail'></div>";document.getElementById('content').innerHTML=h;}
function doSearch(){const q=(document.getElementById('bSearch').value||'').toLowerCase();let out="";Object.entries(BIBLE_DB).forEach(([ref,txt])=>{if(ref.toLowerCase().includes(q)||txt.toLowerCase().includes(q))out+="<div style='padding:8px;background:#f6f8ff;border-radius:8px;margin:4px 0;cursor:pointer' onclick='openBook("John",21)'><b>"+ref+"</b> "+txt+"</div>";});document.getElementById('bRes').innerHTML=out||"Try love, shepherd, John 3:16";}
function openBook(b,ch){const cnt=CHAPTERS[b]||30;let h="<div class='card'><h3>"+b+" — "+cnt+" chapters</h3><div style='display:flex;flex-wrap:wrap;gap:6px'>";for(let i=1;i<=cnt;i++)h+="<button class='btn2' style='width:auto' onclick='openChap(""+b+"","+i+")'>"+i+"</button>";h+="</div></div><div id='cDetail'></div>";document.getElementById('bDetail').innerHTML=h;if(ch)openChap(b,ch);}
function openChap(b,c){let h="<div class='card'><h3>"+b+" "+c+" — <span class='chip'>LSB</span> Check=read Highlight=yellow</h3>";for(let v=1;v<=20;v++){const key=b+"-"+c+"-"+v;const chk=readVerses[key]?'checked':'';const hl=highlights[key]?'hl':'';h+="<div class='verse "+hl+"' id='v-"+key+"'><input type='checkbox' "+chk+" onchange='toggleRead(""+key+"")' style='width:20px'><div><b>"+v+"</b> Verse "+v+" of "+b+" "+c+"</div><button class='btn2' style='width:auto;margin-left:auto' onclick='toggleHL(""+key+"")'>🖍️</button></div>";}h+="</div>";document.getElementById('cDetail').innerHTML=h;}
function toggleRead(k){readVerses[k]=!readVerses[k];if(!readVerses[k])delete readVerses[k];safeSet('readVerses',readVerses);}
function toggleHL(k){highlights[k]=!highlights[k];if(!highlights[k])delete highlights[k];safeSet('highlights',highlights);document.getElementById('v-'+k).classList.toggle('hl');}
function renderPlan(){let h="<div class='card'><h3>📅 Year Plan 365 Days</h3><p>Books, chapters, verses + checkbox per day</p></div>";for(let i=1;i<=365;i++){if(i>40&&i%10!==0&&i<360)continue;const chk=planProgress[i]?'checked':'';h+="<div class='card' style='display:flex;gap:10px'><input type='checkbox' "+chk+" onchange='togglePlan("+i+")' style='width:22px'><div><b>Day "+i+"</b> — "+BOOKS[i%66]+" "+(i%30+1)+"</div></div>";}document.getElementById('content').innerHTML=h;}
function togglePlan(d){planProgress[d]=!planProgress[d];if(!planProgress[d])delete planProgress[d];safeSet('planProgress',planProgress);}
let tIdx=0,tScore=0;const TQ=[{q:"How many days creation?",a:["6","7"],c:0},{q:"Where Jesus born?",a:["Bethlehem","Nazareth"],c:0},{q:"Who built ark?",a:["Noah","Moses"],c:0}];
function renderTriviaMenu(){tIdx=0;tScore=0;renderTrivia();}
function renderTrivia(){const rules="<div class='card'><h3>🧠 Trivia Rules</h3><p>10pts +2 perfect bonus. Final score shows first name encouraging. Leaderboard aggregated per day per person adds together.</p><button class='btn2' onclick='renderLeader()'>🏆 Leaderboard</button></div>";if(tIdx>=TQ.length){const fn=currentUser?currentUser.firstName:'Friend';const pct=Math.round(tScore/TQ.length*100);const msg=pct===100?"Amazing "+fn+"! 🔥":"Great job "+fn+"! 🌱";const today=new Date().toISOString().slice(0,10);const key=(currentUser?currentUser.email:'guest')+"_"+today;const prev=leaderboard[key]?leaderboard[key].score:0;leaderboard[key]={firstName:fn,date:today,score:prev+tScore*10+(pct===100?2:0)};safeSet('leaderboard',leaderboard);document.getElementById('content').innerHTML=rules+"<div class='card' style='text-align:center'><h1>"+tScore+"/"+TQ.length+"</h1><p>"+msg+"</p><button class='btn' onclick='renderTriviaMenu()'>Again</button></div>";return;}const q=TQ[tIdx];let h=rules+"<div class='card'><h3>Q"+(tIdx+1)+": "+q.q+"</h3>";q.a.forEach((o,i)=>{h+="<button class='btn2' onclick='if("+i+"==="+q.c+")tScore++;tIdx++;renderTrivia()'>"+o+"</button>";});h+="</div>";document.getElementById('content').innerHTML=h;}
function renderLeader(){let arr=Object.values(leaderboard).sort((a,b)=>b.score-a.score);let h="<div class='card'><h3>🏆 Leaderboard (aggregated)</h3>";arr.forEach(r=>{h+="<div style='display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee'><span>"+r.firstName+" "+r.date+"</span><b>"+r.score+" pts</b></div>";});h+="<button class='btn2' onclick='renderTriviaMenu()'>Back</button></div>";document.getElementById('content').innerHTML=h;}
function renderPraise(){document.getElementById('content').innerHTML="<div class='card'><h3>🙌 Praise</h3><input id='prIn' placeholder='Praise'><button class='btn' onclick='praises.push({name:currentUser.firstName,text:document.getElementById("prIn").value});safeSet("praise",praises);renderPraise()'>Post</button></div>"+praises.slice().reverse().map(p=>"<div class='card'><b>"+p.name+"</b><p>"+p.text+"</p></div>").join('');}
function renderPrayer(){document.getElementById('content').innerHTML="<div class='card'><h3>🙏 Prayer (🙏 count one tap)</h3><input id='pyIn' placeholder='Request'><button class='btn' onclick='prayers.push({name:currentUser.firstName,text:document.getElementById("pyIn").value,count:0});safeSet("prayers",prayers);renderPrayer()'>Post</button></div>"+prayers.slice().reverse().map((p,i)=>{const real=prayers.length-1-i;return "<div class='card'><b>"+p.name+"</b><p>"+p.text+"</p><span class='chip'>🙏 "+(p.count||0)+"</span> <button class='btn2' style='width:auto' onclick='if(!prayedMap["+real+"]){prayedMap["+real+"]=true;prayers["+real+"].count++;safeSet("prayers",prayers);safeSet("prayed",prayedMap);renderPrayer()}'>🙏 Prayed</button></div>";}).join('');}
function renderSuggest(){document.getElementById('content').innerHTML="<div class='card'><h3>💡 Suggestions (private)</h3><textarea id='suIn'></textarea><button class='btn' onclick='suggestions.push({text:document.getElementById("suIn").value});safeSet("suggestions",suggestions);alert("Sent");renderSuggest()'>Submit</button></div>";}
function renderShare(){const url='https://pastor-j.github.io/livingwaterchurch/';document.getElementById('content').innerHTML="<div class='card' style='text-align:center'><h3>🔗 Share</h3><img src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://pastor-j.github.io/livingwaterchurch/'><p>"+url+"</p><button class='btn' onclick='navigator.clipboard.writeText(""+url+"");alert("Copied")'>Copy</button></div>";}
