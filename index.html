<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Water Church</title>
<link rel="manifest" href="site.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:linear-gradient(135deg,#0f172a,#1e3a8a,#38bdf8);min-height:100vh}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.cardL{background:#fff;border-radius:24px;padding:30px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.cardL img{width:130px;height:130px;background:#0f172a;border-radius:16px;padding:10px;object-fit:contain;margin:0 auto 12px;display:block}
.cardL input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin:6px 0;font-size:16px}
.cardL button{width:100%;padding:14px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:16px;margin-top:10px;cursor:pointer}
#app{display:none;min-height:100vh;flex-direction:row}#side{width:250px;background:#0f172a;position:fixed;top:0;left:0;bottom:0;padding:18px;display:flex;flex-direction:column;gap:6px;color:#fff;overflow:auto}#side .b{display:flex;align-items:center;gap:10px;margin-bottom:18px}#side .b img{width:48px;height:48px;background:#fff;border-radius:10px;padding:4px}#side button{background:transparent;border:none;color:#94a3b8;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}#side button.active{background:#1e293b;color:#fff}#main{margin-left:250px;padding:22px;flex:1} .box{background:#fff;color:#0f172a;border-radius:16px;padding:18px;margin-bottom:14px}
.bGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;margin-top:12px} .bGrid button{padding:10px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-weight:700;font-size:13px}
.chapGrid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0} .chapGrid button{padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer}
.verse{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.dayRow{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border-radius:10px;margin-bottom:8px} .dayRow.checked{background:#ecfdf5} 
.progress{background:#e2e8f0;border-radius:20px;height:18px;overflow:hidden;margin:10px 0} .progressBar{height:100%;background:linear-gradient(90deg,#0ea5e9,#10b981)}
.trivOpt{width:100%;text-align:left;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;margin:8px 0;background:#fff;cursor:pointer} .trivOpt.correct{background:#bbf7d0;border-color:#22c55e} .trivOpt.wrong{background:#fecaca;border-color:#ef4444} .trivOpt.disabled{pointer-events:none}
.praiseCard{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid #ec4899} .heartBtn{padding:6px 14px;border-radius:20px;border:1px solid #f9a8d4;background:#fff;cursor:pointer} .heartBtn.loved{background:#fce7f3;border-color:#ec4899}
.prayerCard{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid #0ea5e9} .prayBtn{padding:6px 14px;border-radius:20px;border:1px solid #7dd3fc;background:#fff;cursor:pointer} .prayBtn.prayed{background:#e0f2fe;border-color:#0ea5e9}
.dailyVerse{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.dailyVerse::before{content:'"';position:absolute;top:10px;left:14px;font-size:60px;opacity:.15;font-family:serif}
@media(max-width:768px){#side{left:-260px;transition:.3s;z-index:99}#side.open{left:0}#main{margin-left:0}}
</style></head>

function getDailyVerse(){
  var now=new Date();
  var start=new Date(now.getFullYear(),0,0);
  var diff=now-start;
  var day=Math.floor(diff/(1000*60*60*24));
  var idx=day % dailyVerses.length;
  return dailyVerses[idx];
}

const CLOUD_BUCKET='lwctrivia2026v4'; const CLOUD_KEY='scores';
async function syncCloud(name, pts){
  try{
    let cur={};
    try{
      let r=await fetch('https://kvdb.io/'+CLOUD_BUCKET+'/'+CLOUD_KEY+'?t='+Date.now(), {cache:'no-store'});
      if(r.ok){ let t=await r.text(); if(t && t.trim().startsWith('{')) cur=JSON.parse(t); }
    }catch(e){}
    try{
      let backup=JSON.parse(localStorage.getItem('cloud_backup')||'{}');
      for(var k in backup){ if(!cur[k] || backup[k]>cur[k]) cur[k]=backup[k]; }
    }catch(e){}
    cur[name]=(cur[name]||0)+pts;
    localStorage.setItem('cloud_backup', JSON.stringify(cur));
    try{
      await fetch('https://kvdb.io/'+CLOUD_BUCKET+'/'+CLOUD_KEY, {method:'POST', body: JSON.stringify(cur)});
    }catch(e){}
  }catch(e){}
}
async function loadCloud(){
  try{
    let r=await fetch('https://kvdb.io/'+CLOUD_BUCKET+'/'+CLOUD_KEY+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw 1;
    let t=await r.text();
    if(!t || !t.trim()) return JSON.parse(localStorage.getItem('cloud_backup')||'{}');
    let j=JSON.parse(t);
    try{
      let backup=JSON.parse(localStorage.getItem('cloud_backup')||'{}');
      for(var k in backup){ if(!j[k] || backup[k]>j[k]) j[k]=backup[k]; }
    }catch(e){}
    localStorage.setItem('cloud_backup', JSON.stringify(j));
    return j;
  }catch(e){
    try{ return JSON.parse(localStorage.getItem('cloud_backup')||'{}'); }catch(e2){ return {}; }
  }
}
async function refreshCloudBoard(){
  var st=document.getElementById('cloudStatus');

    }
  }catch(e){ console.log('load reading failed', e); }
}

      html+="<div class='box' style='border-left:4px solid #e11d48'><div style='display:flex;justify-content:space-between;align-items:flex-start'><div><b style='color:#be123c'>"+f.ref+"</b> <small style='color:#94a3b8'>"+f.date+"</small><p style='margin:8px 0;font-style:italic'>\""+f.text.replace(/</g,'&lt;')+"\"</p></div><button onclick='removeFavorite("+f.id+")' style='background:#fee2e2;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer'>🗑️</button></div><div style='margin-top:8px;display:flex;gap:8px'><button onclick=\"navigator.clipboard.writeText('"+f.ref.replace(/'/g,"\\'")+" - '+`"+f.text.replace(/`/g,'').replace(/'/g,"\\'")+"`); alert('Copied!')\" style='padding:6px 10px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:20px;font-size:12px;cursor:pointer'>📋 Copy</button><button onclick=\"if(navigator.share){navigator.share({title:'"+f.ref.replace(/'/g,"\\'")+"', text:'"+f.ref.replace(/'/g,"\\'")+" - "+f.text.replace(/'/g,"\\'").replace(/\n/g,' ')+"'});} else { alert('Share: "+f.ref.replace(/'/g,"\\'")+"') }\" style='padding:6px 10px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;font-size:12px;cursor:pointer'>📤 Share</button></div></div>";
    });
  }

}
const CLOUD_FAV_BUCKET='lwc_fav_2026v5';
async function syncFavoritesToCloud(){
  try{
    var u=getUser(); var email=(u&&u.email)||'guest'; if(email=='guest') return;
    var key='fav_'+email.replace(/[^a-zA-Z0-9]/g,'_');
    var list=getFavorites();
    await fetch('https://kvdb.io/'+CLOUD_FAV_BUCKET+'/'+key, {method:'POST', body: JSON.stringify(list)});
  }catch(e){}
}
async function loadFavoritesFromCloud(){
  try{
    var u=getUser(); var email=(u&&u.email)||'guest'; if(email=='guest') return;
    var key='fav_'+email.replace(/[^a-zA-Z0-9]/g,'_');
    var r=await fetch('https://kvdb.io/'+CLOUD_FAV_BUCKET+'/'+key+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    var t=await r.text(); if(!t.trim().startsWith('[')) return;
    var cloudList=JSON.parse(t);
    var local=getFavorites();
    // merge
    var merged=[...local];
    cloudList.forEach(function(cf){
      if(!merged.some(lf=>lf.ref===cf.ref)){ merged.push(cf); }
    });
    if(merged.length!==local.length){
      localStorage.setItem('favorite_verses', JSON.stringify(merged));
    }
  }catch(e){}
}

// TRIVIA
let currentTrivia=null, questionStart=null, currentQIndex=0, dayScore=0;
function getDailyQuestions(){
  var today=new Date();
  var dayOfYear=Math.floor((today - new Date(today.getFullYear(),0,0))/1000/60/60/24);
  // Use dayOfYear as start, but ensure 5 unique consecutive from large bank
  var start=(dayOfYear*5)%triviaBank.length;
  var qs=[];
  for(var i=0;i<5;i++){
    qs.push(triviaBank[(start+i)%triviaBank.length]);
  }
  return qs;
}
function renderTrivia(container,name){
  var u=getUser(); var email=(u&&u.email)||'guest'; var todayStr=new Date().toISOString().slice(0,10); var doneKey='trivia_done_'+email+'_'+todayStr; var isDone=localStorage.getItem(doneKey)=='1';
  var totalScore=0; try{var all=JSON.parse(localStorage.getItem('trivia_all')||'{}'); totalScore=all[name]||0;}catch(e){}
  if(isDone){var todayScore=parseInt(localStorage.getItem('trivia_score_'+todayStr+'_'+email)||'0'); container.innerHTML="<div class='box'><h2>🧠 Daily Trivia - Done</h2><p>Today: <b>"+todayScore+" pts</b> Total: <b>"+totalScore+" pts</b></p></div>"+renderLeaderboard(); return;}
  currentTrivia=getDailyQuestions(); currentQIndex=0; dayScore=0;
  container.innerHTML="<div class='box'><h2>🧠 Daily Trivia - 5 Questions</h2><p>Welcome, "+name+"!</p><div id='triviaQ' style='margin-top:12px'></div><div style='margin-top:8px'><span id='scoreDisplay' style='background:#10b981;color:#fff;padding:4px 10px;border-radius:99px;font-size:12px'>Score: 0</span></div></div>"+renderLeaderboard();
  showQuestion();
}
function showQuestion(){if(!currentTrivia||currentQIndex>=currentTrivia.length){finishTrivia();return} var q=currentTrivia[currentQIndex]; var html="<p>Q"+(currentQIndex+1)+"/5</p><h3 style='margin:8px 0'>"+q.q+"</h3><div id='options'>"; q.a.forEach(function(opt,idx){html+="<button class='trivOpt' id='opt_"+idx+"' onclick='answerQ("+idx+")'>"+opt+"</button>";}); html+="</div>"; document.getElementById('triviaQ').innerHTML=html; questionStart=Date.now();}
function answerQ(chosen){var q=currentTrivia[currentQIndex]; var elapsed=(Date.now()-questionStart)/1000; var isCorrect=chosen===q.c; var bonus=(isCorrect&&elapsed<=5)?2:0; if(isCorrect) dayScore+=10+bonus; for(var i=0;i<4;i++){var btn=document.getElementById('opt_'+i); if(!btn) continue; btn.classList.add('disabled'); btn.onclick=null; if(i===q.c) btn.classList.add('correct'); if(i===chosen&&i!==q.c) btn.classList.add('wrong');} document.getElementById('scoreDisplay').textContent='Score: '+dayScore+(bonus?' (+'+bonus+' bonus!)':''); setTimeout(function(){currentQIndex++; showQuestion();},1100);}
function finishTrivia(){var u=getUser(); var name=(u&&u.firstName)||window.currentName||'Friend'; var email=(u&&u.email)||'guest'; var todayStr=new Date().toISOString().slice(0,10); localStorage.setItem('trivia_done_'+email+'_'+todayStr,'1'); localStorage.setItem('trivia_score_'+todayStr+'_'+email, dayScore.toString()); try{var all=JSON.parse(localStorage.getItem('trivia_all')||'{}'); all[name]=(all[name]||0)+dayScore; localStorage.setItem('trivia_all', JSON.stringify(all)); var weekId=getWeekId(new Date()); var weekKey='trivia_week_'+weekId; var weekData=JSON.parse(localStorage.getItem(weekKey)||'{}'); weekData[email+'|'+name]=(weekData[email+'|'+name]||0)+dayScore; localStorage.setItem(weekKey, JSON.stringify(weekData));}catch(e){} try{ syncCloud(name, dayScore); }catch(e){} var q=document.getElementById('triviaQ'); if(q) q.innerHTML="<h3>🎉 Done, "+name+"! Score: <b>"+dayScore+" pts</b></h3><p style='font-size:12px;color:#64748b'>Synced to church-wide board!</p><button onclick=\"show('trivia')\" style='margin-top:10px;padding:8px 14px;background:#0f172a;color:#fff;border:none;border-radius:8px'>See Everybody →</button>";}
function renderLeaderboard(){try{var all=JSON.parse(localStorage.getItem('trivia_all')||'{}'); var sorted=Object.entries(all).sort(function(a,b){return b[1]-a[1];}); var html="<div class='box'><h3>🏆 Everybody's Leaderboard - Live Church-Wide</h3><p style='font-size:12px;color:#64748b'>Shows EVERY person from ALL phones - auto-updates every 30s</p><div id='cloudList'>"; if(!sorted.length){ html+="<p style='padding:8px;background:#fef3c7;border-radius:8px'>No local scores yet - loading church...</p>"; } else { sorted.slice(0,30).forEach(function(e,i){var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'; var isMe=window.currentName&&e[0]===window.currentName; html+="<div style='display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;"+(isMe?'background:#e0f2fe;border-radius:6px;padding:0 8px':'')+"'><span>"+medal+" "+e[0]+(isMe?' (You)':'')+"</span><b>"+e[1]+" pts</b></div>";}); } html+="</div><div style='margin-top:10px'><button onclick='refreshCloudBoard()' style='padding:6px 12px;border-radius:20px;border:1px solid #0ea5e9;background:#fff;color:#0ea5e9;cursor:pointer;font-size:12px'>🔄 Refresh Live</button> <span id='cloudStatus' style='font-size:11px;color:#94a3b8'>Loading...</span></div></div>"; setTimeout(function(){ refreshCloudBoard(); setInterval(refreshCloudBoard, 30000); },800); return html;}catch(e){return "<div class='box'>Error: "+e+"</div>";}}
function getWeeklyWinnerHtml(){var now=new Date(); var dayOfWeek=now.getDay(); var lastSunday=new Date(now); lastSunday.setDate(now.getDate() - dayOfWeek -7); var lastWeekId=getWeekId(lastSunday); var weekKey='trivia_week_'+lastWeekId; try{var weekData=JSON.parse(localStorage.getItem(weekKey)||'null'); if(!weekData) return ""; var entries=Object.entries(weekData); if(!entries.length) return ""; entries.sort((a,b)=>b[1]-a[1]); var winner=entries[0]; var parts=winner[0].split('|'); var wName=parts[1]||parts[0]; return "<div class='box' style='background:linear-gradient(135deg,#fde68a,#fbbf24);border:2px solid #f59e0b'><h3>🏆 Weekly Winner (Last Sun-Sat)</h3><p>Winner for week of "+lastWeekId+": <b>"+wName+"</b> - "+winner[1]+" pts!</p></div>";}catch(e){return "";}}
