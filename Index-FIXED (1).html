<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Water Church</title>
<link rel="manifest" href="site.webmanifest">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a,#0ea5e9);min-height:100vh;color:#fff}
#loginScreen{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.loginCard{background:rgba(255,255,255,0.95);color:#0f172a;border-radius:20px;padding:32px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.loginCard img{width:120px;height:120px;object-fit:contain;border-radius:16px;display:block;margin:0 auto 12px;background:#0f172a;padding:8px}
.loginCard h1{text-align:center;font-size:24px;font-weight:900} .loginCard h1 span{display:block;font-size:12px;font-weight:700;letter-spacing:3px;color:#0ea5e9;margin-top:2px}
.loginCard input{width:100%;padding:12px 14px;margin:8px 0;border:2px solid #e2e8f0;border-radius:10px;font-size:16px}
.loginCard button{width:100%;padding:14px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:16px;margin-top:12px;cursor:pointer}
#app{display:none;flex-direction:row;min-height:100vh}
#sidebar{width:250px;background:rgba(15,23,42,.9);padding:20px;display:flex;flex-direction:column;gap:6px}
#sidebar .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px} #sidebar .brand img{width:52px;height:52px;border-radius:10px;background:#fff;padding:4px;object-fit:contain}
#sidebar button{text-align:left;background:transparent;border:none;color:#cbd5e1;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
#sidebar button.active,#sidebar button:hover{background:rgba(255,255,255,.15);color:#fff}
#content{flex:1;padding:24px;overflow:auto}
.card{background:rgba(255,255,255,.92);color:#0f172a;border-radius:16px;padding:18px;margin-bottom:16px}
.badge{background:#0ea5e9;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.grid button{padding:12px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-weight:700}
.verseRow{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9}
@media(max-width:768px){#sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:.3s}#sidebar.open{left:0}#app{flex-direction:column}}
</style>
</head>

<script>
function safeSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){alert('Storage full - clearing old image');localStorage.removeItem('weeklySermon');try{localStorage.setItem(k,v);return true}catch(e2){localStorage.clear();return false}}}
function getSermon(){try{let s=localStorage.getItem('weeklySermon');return s?JSON.parse(s):null}catch(e){localStorage.removeItem('weeklySermon');return null}}
function shrinkImage(file,cb){const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const max=900;let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.7))};img.src=e.target.result};r.readAsDataURL(file)}
function doLogin(){const fn=document.getElementById('firstName').value.trim();const ln=document.getElementById('lastName').value.trim();const em=document.getElementById('email').value.trim();const dob=document.getElementById('dob').value.trim();if(!fn||!em||!dob){alert('Fill First Name, Email, DOB');return}safeSet('lwc_user',JSON.stringify({firstName:fn,lastName:ln,email:em,dob:dob}));initApp()}
function doLogout(){if(confirm('Logout?')){localStorage.removeItem('lwc_user');location.reload()}}
function clearSermonImage(){localStorage.removeItem('weeklySermon');alert('Cleared! Reloading...');location.reload()}
function getUser(){try{return JSON.parse(localStorage.getItem('lwc_user')||'null')}catch{return null}}
function initApp(){const u=getUser();if(!u){document.getElementById('loginScreen').style.display='flex';document.getElementById('app').style.display='none';return}document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='flex';showTab('home')}
function showTab(t){document.querySelectorAll('#sidebar button').forEach(b=>b.classList.remove('active'));const map={home:0,bible:1,year:2,trivia:3,praise:4,prayer:5,suggestions:6,share:7};let btns=document.querySelectorAll('#sidebar button');if(map[t]!==undefined)btns[map[t]].classList.add('active');const c=document.getElementById('tabContent');if(t==='home')renderHome(c);else if(t==='bible')renderBible(c);else if(t==='year')renderYear(c);else if(t==='trivia')renderTrivia(c);else if(t==='praise')renderPraise(c);else if(t==='prayer')renderPrayer(c);else if(t==='suggestions')renderSugg(c);else if(t==='share')renderShare(c);document.getElementById('sidebar').classList.remove('open')}
function renderHome(c){const u=getUser();const now=new Date();let bday='';if(u&&u.dob){try{let parts=u.dob.split('/');if(parseInt(parts[0])==now.getMonth()+1&&parseInt(parts[1])==now.getDate())bday="<div class='card' style='background:#fde68a;border:2px solid #f59e0b'>🎉 Happy Birthday "+u.firstName+"!</div>"}catch{}}const sermon=getSermon();let sHtml=sermon?"<div class='card'><h3>📖 This Week's Sermon</h3><h2 style='margin:8px 0'>"+(sermon.title||"")+"</h2><p style='color:#0ea5e9;font-weight:700'>"+(sermon.scripture||"")+"</p><p>"+(sermon.desc||"")+"</p>"+(sermon.img?"<img src='"+sermon.img+"' style='width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-top:10px'>":"")+"</div>":"<div class='card'><h3>📖 This Week's Sermon</h3><p>No sermon yet. Pastor can update.</p></div>";c.innerHTML=bday+"<div class='card'><h2>Welcome Home "+(u?u.firstName:"")+"! 🙏</h2><p style='margin-top:8px'><span class='badge'>Sunday 7PM Central</span></p><div style='margin-top:12px'><button onclick="document.getElementById('sermonAdmin').style.display=document.getElementById('sermonAdmin').style.display=='none'?'block':'none'" style='padding:10px 16px;border-radius:8px;border:1px solid #0f172a;background:#fff;cursor:pointer;font-weight:700'>Pastor Update</button></div><div id='sermonAdmin' style='display:none;margin-top:12px;border-top:1px solid #e2e8f0;padding-top:12px'><input id='sTitle' placeholder='Sermon Title' style='width:100%;padding:10px;margin:6px 0;border:1px solid #e2e8f0;border-radius:8px'><input id='sScript' placeholder='Scripture' style='width:100%;padding:10px;margin:6px 0;border:1px solid #e2e8f0;border-radius:8px'><textarea id='sDesc' placeholder='Description' style='width:100%;padding:10px;margin:6px 0;border:1px solid #e2e8f0;border-radius:8px'></textarea><input type='file' id='sImg' accept='image/*'><br><input type='password' id='sPass' placeholder='Pastor Password' style='padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin-top:6px'><button onclick='saveSermon()' style='padding:10px 16px;background:#0f172a;color:#fff;border:none;border-radius:8px;margin-left:8px;cursor:pointer'>Save</button><p style='font-size:11px;color:#64748b'>Auto-shrinks any photo to ~300KB - no blue screen</p></div></div>"+sHtml}
function saveSermon(){const t=document.getElementById('sTitle').value,sc=document.getElementById('sScript').value,d=document.getElementById('sDesc').value,p=document.getElementById('sPass').value,f=document.getElementById('sImg').files[0];if(p!=='PastorJ2026'){alert('Wrong password');return}const done=imgData=>{const obj={title:t,scripture:sc,desc:d,img:imgData||''};safeSet('weeklySermon',JSON.stringify(obj));alert('Saved!');showTab('home')};if(f){shrinkImage(f,done)}else{done('')}}
const books=["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];
function renderBible(c){c.innerHTML="<div class='card'><h2>📖 Bible - 66 Books</h2><input id='bSearch' placeholder='Search John 3:16' oninput='bibleSearch(this.value)' style='width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin:10px 0'><div class='grid' id='bGrid'></div><div id='bContent' style='margin-top:16px'></div></div>";const g=document.getElementById('bGrid');g.innerHTML=books.map(b=>"<button onclick="openBook('"+b+"')">"+b+"</button>").join('')}
function openBook(b){const content=document.getElementById('bContent');let chHtml="<h3>"+b+"</h3><div style='display:flex;flex-wrap:wrap;gap:6px;margin:10px 0'>";for(let i=1;i<=10;i++)chHtml+="<button onclick="openChapter('"+b+"',"+i+")" style='padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer'>"+i+"</button>";chHtml+="</div><div id='chap'></div>";content.innerHTML=chHtml}
function openChapter(book,chap){const div=document.getElementById('chap');let vHtml="<h4>"+book+" "+chap+"</h4>";for(let v=1;v<=10;v++){const key="read_"+book+"_"+chap+"_"+v;const isRead=localStorage.getItem(key)=='1';vHtml+="<div class='verseRow'><input type='checkbox' "+(isRead?"checked":"")+" onchange="localStorage.setItem('"+key+"', this.checked?'1':'0')"><span><b>"+v+"</b> Verse "+v+" placeholder - checkbox saves. <button onclick="hl('"+book+"_"+chap+"_"+v+"')" style='background:#fef08a;border:none;border-radius:4px;padding:2px 6px;cursor:pointer;font-size:11px'>Highlight</button></span></div>"}div.innerHTML=vHtml}
function hl(k){localStorage.setItem('hl_'+k,'1');alert('Highlighted!')}
function bibleSearch(q){if(!q)return;if(q.toLowerCase().includes('john 3:16')){openBook('John');setTimeout(()=>openChapter('John',3),200);return}document.getElementById('bContent').innerHTML="<p>Searching for <b>"+q+"</b></p>"}
function renderYear(c){let html="<div class='card'><h2>📅 Year Plan</h2></div>";for(let d=1;d<=15;d++){const key='year_'+d;const done=localStorage.getItem(key)=='1';html+="<div class='card'><label style='display:flex;gap:10px'><input type='checkbox' "+(done?"checked":"")+" onchange="localStorage.setItem('"+key+"', this.checked?'1':'0')"><span><b>Day "+d+"</b> - Reading plan day "+d+"</span></label></div>"}c.innerHTML=html}
const triviaQs=[{q:'Who built the ark?',a:['Moses','Noah','David'],c:1},{q:'How many books in Bible?',a:['66','70','50'],c:0},{q:'Where was Jesus born?',a:['Nazareth','Bethlehem','Jerusalem'],c:1}];let tIdx=0,tScore=0;
function renderTrivia(c){tIdx=0;tScore=0;c.innerHTML="<div class='card'><h2>🧠 Trivia</h2><p style='font-size:12px'>10pts +2 perfect bonus. Leaderboard aggregated</p><div id='tQ' style='margin-top:12px'></div></div><div id='tBoard' class='card'><h3>Leaderboard</h3><div id='tList'></div></div>";showQ();loadBoard()}
function showQ(){if(tIdx>=triviaQs.length){const u=getUser();const name=u?u.firstName:'Friend';document.getElementById('tQ').innerHTML="<h2>Amazing "+name+"! 🔥</h2><p>Score: "+tScore+"</p><button onclick='saveTriv()' style='padding:10px 16px;background:#0f172a;color:#fff;border:none;border-radius:8px;cursor:pointer'>Save to Leaderboard</button>";return}const q=triviaQs[tIdx];document.getElementById('tQ').innerHTML="<p><b>Q"+(tIdx+1)+": "+q.q+"</b></p>"+q.a.map((opt,i)=>"<button onclick='ans("+i+")' style='display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer'>"+opt+"</button>").join('')}
function ans(i){if(i===triviaQs[tIdx].c)tScore+=10;tIdx++;if(tIdx===triviaQs.length&&tScore===triviaQs.length*10)tScore+=2;showQ()}
function saveTriv(){const u=getUser();if(!u)return;const key='trivia_'+new Date().toISOString().slice(0,10)+'_'+u.email;const prev=parseInt(localStorage.getItem(key)||'0');localStorage.setItem(key,(prev+tScore).toString());let all=JSON.parse(localStorage.getItem('trivia_all')||'{}');all[u.firstName+' '+u.lastName]=(all[u.firstName+' '+u.lastName]||0)+tScore;localStorage.setItem('trivia_all',JSON.stringify(all));alert('Saved!');loadBoard()}
function loadBoard(){try{const all=JSON.parse(localStorage.getItem('trivia_all')||'{}');const el=document.getElementById('tList');if(!el)return;el.innerHTML=Object.entries(all).sort((a,b)=>b[1]-a[1]).map(n=>"<div style='display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f1f5f9'><span>"+n[0]+"</span><b>"+n[1]+" pts</b></div>").join('')||'<p>No scores yet</p>'}catch{}}
function renderPraise(c){c.innerHTML="<div class='card'><h2>🙌 Praise Wall</h2><textarea id='prText' placeholder='Share praise...' style='width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px'></textarea><button onclick='addPraise()' style='margin-top:8px;padding:10px 16px;background:#0f172a;color:#fff;border:none;border-radius:8px;cursor:pointer'>Post</button></div><div id='prList'></div>";loadPraise()}
function addPraise(){const t=document.getElementById('prText').value.trim();if(!t)return;const u=getUser();let list=JSON.parse(localStorage.getItem('praise')||'[]');list.unshift({name:u.firstName+' '+u.lastName,text:t,date:new Date().toLocaleDateString()});localStorage.setItem('praise',JSON.stringify(list));document.getElementById('prText').value='';loadPraise()}
function loadPraise(){try{const list=JSON.parse(localStorage.getItem('praise')||'[]');document.getElementById('prList').innerHTML=list.map(p=>"<div class='card'><b>"+p.name+"</b> <small>"+p.date+"</small><p style='margin-top:6px'>"+p.text+"</p></div>").join('')}catch{}}
function renderPrayer(c){c.innerHTML="<div class='card'><h2>🙏 Prayer Wall</h2><textarea id='pyText' placeholder='Prayer request...' style='width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px'></textarea><button onclick='addPrayer()' style='margin-top:8px;padding:10px 16px;background:#0f172a;color:#fff;border:none;border-radius:8px;cursor:pointer'>Post</button></div><div id='pyList'></div>";loadPrayer()}
function addPrayer(){const t=document.getElementById('pyText').value.trim();if(!t)return;const u=getUser();let list=JSON.parse(localStorage.getItem('prayer')||'[]');list.unshift({id:Date.now(),name:u.firstName+' '+u.lastName,text:t,prayed:0,prayedBy:[],date:new Date().toLocaleDateString()});localStorage.setItem('prayer',JSON.stringify(list));document.getElementById('pyText').value='';loadPrayer()}
function loadPrayer(){try{let list=JSON.parse(localStorage.getItem('prayer')||'[]');document.getElementById('pyList').innerHTML=list.map((p,i)=>"<div class='card'><b>"+p.name+"</b> <small>"+p.date+"</small><p style='margin:6px 0'>"+p.text+"</p><button onclick='doPray("+i+")' style='padding:6px 12px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;cursor:pointer'>🙏 Prayed "+p.prayed+"</button></div>").join('')}catch{}}
function doPray(idx){let list=JSON.parse(localStorage.getItem('prayer')||'[]');const u=getUser();const email=u.email;if(list[idx].prayedBy.includes(email)){alert('You already prayed!');return}list[idx].prayed++;list[idx].prayedBy.push(email);localStorage.setItem('prayer',JSON.stringify(list));loadPrayer()}
function renderSugg(c){c.innerHTML="<div class='card'><h2>💡 Suggestions</h2><textarea id='sgText' placeholder='Suggestion...' style='width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px'></textarea><button onclick='addSugg()' style='margin-top:8px;padding:10px 16px;background:#0f172a;color:#fff;border:none;border-radius:8px;cursor:pointer'>Submit</button></div><div id='sgList'></div>";loadSugg()}
function addSugg(){const t=document.getElementById('sgText').value.trim();if(!t)return;const u=getUser();let list=JSON.parse(localStorage.getItem('suggestions')||'[]');list.unshift({name:u.firstName+' '+u.lastName,text:t,date:new Date().toLocaleDateString()});localStorage.setItem('suggestions',JSON.stringify(list));document.getElementById('sgText').value='';alert('Sent!');loadSugg()}
function loadSugg(){try{const list=JSON.parse(localStorage.getItem('suggestions')||'[]');const el=document.getElementById('sgList');if(el)el.innerHTML=list.map(s=>"<div class='card'><b>"+s.name+"</b> <small>"+s.date+"</small><p>"+s.text+"</p></div>").join('')}catch{}}
function renderShare(c){const link='https://officalpastorjministry-oss.github.io/LivingWaterChurch/';c.innerHTML="<div class='card'><h2>🔗 Share / QR</h2><input value='"+link+"' style='width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin:10px 0' readonly><div style='display:flex;gap:10px'><button onclick="navigator.clipboard.writeText('"+link+"');alert('Copied!')" style='padding:10px 16px;background:#0f172a;color:#fff;border:none;border-radius:8px;cursor:pointer'>Copy Link</button></div><div style='margin-top:16px;text-align:center'><img src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(link)+"' style='border-radius:12px'><p style='font-size:12px;color:#64748b;margin-top:6px'>Scan QR</p></div></div>"}
initApp();
let btn=document.createElement('button');btn.id='sidebarButton';btn.textContent='☰';btn.style.cssText='display:none;position:fixed;top:10px;left:10px;z-index:60;padding:10px 14px;border-radius:8px;border:none;background:#0f172a;color:#fff';btn.onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.body.appendChild(btn);if(window.innerWidth<=768)btn.style.display='block';window.addEventListener('resize',()=>{btn.style.display=window.innerWidth<=768?'block':'none'});
</script>
</body>
</html>
