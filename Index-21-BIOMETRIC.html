<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Water Church</title>
<link rel="manifest" href="site.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:linear-gradient(135deg,#0f172a,#1e3a8a,#38bdf8);min-height:100vh}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.cardL{background:#fff;border-radius:24px;padding:30px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.cardL img{width:130px;height:130px;background:#0f172a;border-radius:16px;padding:10px;object-fit:contain;margin:0 auto 12px;display:block}
.cardL input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin:6px 0;font-size:16px}
.cardL button{width:100%;padding:14px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:16px;margin-top:10px;cursor:pointer}
#app{display:none;min-height:100vh;flex-direction:row}#side{width:250px;background:#0f172a;position:fixed;top:0;left:0;bottom:0;padding:18px;display:flex;flex-direction:column;gap:6px;color:#fff;overflow:auto}#side .b{display:flex;align-items:center;gap:10px;margin-bottom:18px}#side .b img{width:48px;height:48px;background:#fff;border-radius:10px;padding:4px}#side button{background:transparent;border:none;color:#94a3b8;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}#side button.active{background:#1e293b;color:#fff}#main{margin-left:250px;padding:22px;flex:1} .box{background:#fff;color:#0f172a;border-radius:16px;padding:18px;margin-bottom:14px}
.bGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;margin-top:12px} .bGrid button{padding:10px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-weight:700;font-size:13px}
.chapGrid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0} .chapGrid button{padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer}
.verse{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.dayRow{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border-radius:10px;margin-bottom:8px} .dayRow.checked{background:#ecfdf5} 
.progress{background:#e2e8f0;border-radius:20px;height:18px;overflow:hidden;margin:10px 0} .progressBar{height:100%;background:linear-gradient(90deg,#0ea5e9,#10b981)}
.trivOpt{width:100%;text-align:left;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;margin:8px 0;background:#fff;cursor:pointer} .trivOpt.correct{background:#bbf7d0;border-color:#22c55e} .trivOpt.wrong{background:#fecaca;border-color:#ef4444} .trivOpt.disabled{pointer-events:none}
.praiseCard{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid #ec4899} .heartBtn{padding:6px 14px;border-radius:20px;border:1px solid #f9a8d4;background:#fff;cursor:pointer} .heartBtn.loved{background:#fce7f3;border-color:#ec4899}
.prayerCard{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid #0ea5e9} .prayBtn{padding:6px 14px;border-radius:20px;border:1px solid #7dd3fc;background:#fff;cursor:pointer} .prayBtn.prayed{background:#e0f2fe;border-color:#0ea5e9}
.dailyVerse{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.dailyVerse::before{content:'"';position:absolute;top:10px;left:14px;font-size:60px;opacity:.15;font-family:serif}
@media(max-width:768px){#side{left:-260px;transition:.3s;z-index:99}#side.open{left:0}#main{margin-left:0}}

/* DARK MODE SAFE */
body.dark{ background:linear-gradient(135deg,#020617,#0f172a,#1e293b) !important; }
body.dark #side{ background:#020617 !important; }
body.dark .box{ background:#1e293b !important; color:#f1f5f9 !important; border:1px solid #334155 }
body.dark .verse{ border-bottom:1px solid #334155 !important; }
body.dark .bGrid button, body.dark .chapGrid button{ background:#1e293b !important; color:#f1f5f9 !important; border-color:#334155 !important; }
body.dark input, body.dark textarea, body.dark #notesEditor{ background:#0f172a !important; color:#f1f5f9 !important; border-color:#334155 !important; }
body.dark .prayerCard, body.dark .praiseCard, body.dark .dayRow{ background:#1e293b !important; color:#f1f5f9 !important; }
body.dark #login .cardL{ background:#1e293b !important; color:#fff }
body.dark #login .cardL input{ background:#0f172a !important; color:#fff; border-color:#334155 }
body.dark h2, body.dark h3, body.dark h4{ color:#f1f5f9 !important; }

function applyHighlight(color){
  var ed=document.getElementById('notesEditor'); if(!ed) return; ed.focus();
  var sel=window.getSelection(); if(!sel || sel.rangeCount===0 || sel.toString().trim()===''){ alert('Select text first!'); return; }

    else { document.execCommand('hiliteColor',false,color); document.execCommand('backColor',false,color); }
  }catch(e){}
  try{ saveNotes(true); }catch(e){}
}
function saveNotes(silent){

}

// ---- BIBLE-NOTES LINKING ----
function addVerseToNotes(ref, text){
  try{
    var email='anon'; try{ var u=getUser(); if(u&&u.email) email=u.email; }catch(e){}
    var key='pending_notes_'+email;
    var pending=JSON.parse(localStorage.getItem(key)||'[]');
    pending.push({ref:ref, text:text, time:Date.now()});
    localStorage.setItem(key, JSON.stringify(pending));
    // also immediately add to editor if open
    var ed=document.getElementById('notesEditor');
    if(ed){
      var html='<p><b style=\"color:#0f172a;background:#f1f5f9;padding:2px 6px;border-radius:4px;cursor:pointer\" onclick=\"jumpToBible(\''+ref.replace(/'/g, "\\'")+ '\')\">'+ref+' 🔗</b> - '+text.replace(/</g,'&lt;')+'</p><p><br></p>';
      ed.innerHTML+=html;
      saveNotes(true);
      if(confirm('Added '+ref+' to Notes! Go to Notes now?')){ show('notes'); }
    } else {
      if(confirm('Added '+ref+' to Notes! Go to Notes now?')){ show('notes'); }
    }
  }catch(e){ alert('Error: '+e); }
}
function jumpToBible(ref){
  try{
    // ref like "John 3:16"
    var m=ref.match(/^(.+)\s+(\d+):(\d+)/);
    var book, chap, verse;
    if(m){ book=m[1].trim(); chap=parseInt(m[2]); verse=parseInt(m[3]); }
    else { var m2=ref.match(/^(.+)\s+(\d+)/); if(m2){ book=m2[1].trim(); chap=parseInt(m2[2]); verse=1; } }
    if(!book) { alert('Could not parse '+ref); return; }
    var found=books.find(function(b){ return b.toLowerCase()===book.toLowerCase(); });
    if(!found){ found=books.find(function(b){ return b.toLowerCase().indexOf(book.toLowerCase())===0; })||book; }
    show('bible');
    setTimeout(function(){ openBook(found); setTimeout(function(){ openChapter(found, chap); setTimeout(function(){ var el=document.getElementById('verse_'+chap+'_'+verse); if(el){ el.style.background='#fef08a'; el.style.border='2px solid #eab308'; el.style.borderRadius='8px'; el.scrollIntoView({behavior:'smooth', block:'center'}); setTimeout(function(){ el.style.background=''; el.style.border=''; },3000); } },800); },600); },400);
  }catch(e){ alert('Jump error: '+e); }
}
// Patch renderNotes to handle pending and clickable refs
(function(){
  var origRenderNotes=renderNotes;
  renderNotes=function(container){
    origRenderNotes(container);
    setTimeout(function(){
      var email='anon'; try{ var u=getUser(); if(u&&u.email) email=u.email; }catch(e){}
      var key='pending_notes_'+email;
      try{
        var pending=JSON.parse(localStorage.getItem(key)||'[]');
        if(pending.length){
          var ed=document.getElementById('notesEditor');
          if(ed){
            pending.forEach(function(p){
              var html='<p><b style=\"color:#0f172a;background:#f1f5f9;padding:2px 6px;border-radius:4px;cursor:pointer\" onclick=\"jumpToBible(\''+p.ref.replace(/'/g, "\\'")+ '\')\">'+p.ref+' 🔗</b> - '+p.text.replace(/</g,'&lt;')+'</p><p><br></p>';
              ed.innerHTML+=html;
            });
            saveNotes(true);
            localStorage.removeItem(key);
            var st=document.getElementById('notesStatus'); if(st) st.textContent=pending.length+' verses added from Bible ✓';
          }
        }
      }catch(e){}
      // Make existing refs clickable in editor
      try{
        var ed=document.getElementById('notesEditor');
        if(ed){
          // Add click handler for refs - delegate
          ed.addEventListener('click', function(ev){
            var t=ev.target;
            if(t && t.textContent && t.textContent.match(/\w+\s+\d+:\d+/)){
              var ref=t.textContent.replace(' 🔗','').trim();
              if(ref.match(/\w+\s+\d+:\d+/)) jumpToBible(ref);
            }
          });
        }
      }catch(e){}
    },400);
  };
})();

// ---- AUDIO BIBLE SAFE ----
var audioPlaying=false;
function speakChapter(){
  try{
    var verses=[];
    var els=document.querySelectorAll('.verse');
    els.forEach(function(div,i){
      var b=div.querySelector('div');
      if(!b) return;
      var txt=b.innerText||b.textContent||'';
      verses.push(txt);
    });
    if(!verses.length){ alert('No verses loaded yet'); return; }
    if('speechSynthesis' in window) speechSynthesis.cancel();
    var idx=0;
    function speakNext(){
      if(idx>=verses.length){ audioPlaying=false; updateAudioBtn(); document.querySelectorAll('.verse').forEach(function(e){ e.style.background=''; }); return; }
      var utt=new SpeechSynthesisUtterance(verses[idx]);
      utt.rate=0.9;
      utt.onstart=function(){ audioPlaying=true; updateAudioBtn(); document.querySelectorAll('.verse').forEach(function(e){ e.style.background=''; }); var el=document.querySelectorAll('.verse')[idx]; if(el){ el.style.background='#dbeafe'; el.scrollIntoView({behavior:'smooth', block:'center'}); } };
      utt.onend=function(){ idx++; speakNext(); };
      utt.onerror=function(){ idx++; speakNext(); };
      window._audioIdx=idx;
      speechSynthesis.speak(utt);
    }
    speakNext();
  }catch(e){ alert('Audio error: '+e); }
}
function stopAudioSafe(){ try{ speechSynthesis.cancel(); }catch(e){} audioPlaying=false; updateAudioBtn(); document.querySelectorAll('.verse').forEach(function(e){ e.style.background=''; }); }
function pauseAudioSafe(){ try{ speechSynthesis.pause(); audioPlaying=false; updateAudioBtn(); }catch(e){} }
function resumeAudioSafe(){ try{ speechSynthesis.resume(); audioPlaying=true; updateAudioBtn(); }catch(e){} }
function updateAudioBtn(){
  var b=document.getElementById('audioPlayBtn');
  if(!b) return;
  if(audioPlaying){ b.textContent='⏸️ Pause'; b.onclick=pauseAudioSafe; b.style.background='#ef4444'; }
  else if(window.speechSynthesis && speechSynthesis.paused){ b.textContent='▶️ Resume'; b.onclick=resumeAudioSafe; b.style.background='#0f172a'; }
  else { b.textContent='▶️ Play Audio'; b.onclick=speakChapter; b.style.background='#0f172a'; }
  var sb=document.getElementById('audioStopBtn');
  if(sb) sb.style.display= audioPlaying || (speechSynthesis && speechSynthesis.paused) ? 'inline-block':'none';
}

function getStreakData(){ try{ return JSON.parse(localStorage.getItem('streak_data')||'{"current":0,"longest":0,"lastDate":"","dates":[]}'); }catch(e){ return {current:0,longest:0,lastDate:"",dates:[]}; } }
function saveStreakData(d){ localStorage.setItem('streak_data', JSON.stringify(d)); }
function updateStreak(){
  var d=getStreakData(); var today=new Date().toISOString().split('T')[0];
  if(d.lastDate===today) return d;
  var yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1); var yStr=yesterday.toISOString().split('T')[0];
  if(d.lastDate===yStr){ d.current+=1; } else if(d.lastDate===""){ d.current=1; } else { var last=new Date(d.lastDate); var diff=Math.floor((new Date(today)-last)/(1000*60*60*24)); if(diff===1) d.current+=1; else d.current=1; }
  if(d.current>d.longest) d.longest=d.current;
  d.lastDate=today;
  if(d.dates.indexOf(today)===-1) d.dates.push(today);
  if(d.dates.length>90) d.dates=d.dates.slice(-90);
  saveStreakData(d);
  return d;
}

function getStreakData(){ try{ return JSON.parse(localStorage.getItem('streak_data')||'{"current":0,"longest":0,"lastDate":"","dates":[]}'); }catch(e){ return {current:0,longest:0,lastDate:"",dates:[]}; } }
function saveStreakData(d){ localStorage.setItem('streak_data', JSON.stringify(d)); }
function updateStreak(){
  var d=getStreakData(); var today=new Date().toISOString().split('T')[0];
  if(d.lastDate===today) return d;
  var yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1); var yStr=yesterday.toISOString().split('T')[0];
  if(d.lastDate===yStr){ d.current+=1; } else if(d.lastDate===""){ d.current=1; } else { var last=new Date(d.lastDate); var diff=Math.floor((new Date(today)-last)/(1000*60*60*24)); if(diff===1) d.current+=1; else d.current=1; }
  if(d.current>d.longest) d.longest=d.current;
  d.lastDate=today; if(d.dates.indexOf(today)===-1) d.dates.push(today);
  if(d.dates.length>90) d.dates=d.dates.slice(-90);
  saveStreakData(d); return d;
}

function searchOldNotes(){
  var q=(document.getElementById('oldNotesSearchInput').value||'').toLowerCase().trim();
  var editor=document.getElementById('notesEditor'); if(!editor) return;
  var countEl=document.getElementById('oldNotesSearchCount');
  
  // Clear previous highlights
  var marks=editor.querySelectorAll('.search-highlight');
  for(var i=0;i<marks.length;i++){ var m=marks[i]; m.outerHTML=m.innerHTML; }
  
  if(!q){
    if(countEl) countEl.textContent='';
    return;
  }
  
  // Search and highlight
  var text=editor.innerText.toLowerCase();
  var count=0;
  var idx=0;
  while((idx=text.indexOf(q, idx))!==-1){ count++; idx+=q.length; }
  if(countEl) countEl.textContent=count+' found';
  
  // Simple highlight using innerHTML replacement (preserve for search only)
  if(count>0 && count<50){
    var html=editor.innerHTML;
    var regex=new RegExp('('+q.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')+')', 'gi');
    html=html.replace(regex, '<span class="search-highlight" style="background:#fef08a;border:1px solid #eab308;border-radius:3px;padding:0 2px">$1</span>');
    // Only apply if not too big
    if(html.length < editor.innerHTML.length + 5000){
      editor.innerHTML=html;
    }
  }
}

  for(var i=1;i<=365;i++){

  }
  return last;
}
function getYearAutoTargetDay(){
  var last=getLastCompletedDay();
  var next=last+1;
  if(next<1) next=1;
  if(next>365) next=365;
  // If no days completed, fall back to today
  if(last===0){
    try{ return getCurrentDayNumber(); }catch(e){ return 1; }
  }
  return next;
}

// ---- BIOMETRIC AUTH - FACE ID / FINGERPRINT ----
function isBiometricSupported(){
  return window.PublicKeyCredential && navigator.credentials && typeof navigator.credentials.create==='function';
}

function getBiometricKey(email){
  return 'biometric_cred_'+(email||'global').replace(/[^a-z0-9]/gi,'_');
}
function getBiometricEnabledKey(email){
  return 'biometric_enabled_'+(email||'global').replace(/[^a-z0-9]/gi,'_');
}

async function registerBiometric(){
  try{
    if(!isBiometricSupported()){
      alert('Biometric not supported on this device/browser. Try Safari/Chrome latest.');
      return;
    }
    var u=getUser();
    var email=(u&&u.email)||localStorage.getItem('last_biometric_email')||'user@livingwater.local';
    var challenge=new Uint8Array(32);
    window.crypto.getRandomValues(challenge);
    
    var credential=await navigator.credentials.create({
      publicKey:{
        challenge:challenge,
        rp:{name:"Living Water Church", id:location.hostname},
        user:{id:new TextEncoder().encode(email), name:email, displayName:email.split('@')[0]},
        pubKeyCredParams:[{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
        authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", requireResidentKey:false},
        timeout:60000,
        attestation:"none"
      }
    });
    
    if(credential){
      var credId=btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
      localStorage.setItem(getBiometricKey(email), credId);
      localStorage.setItem(getBiometricEnabledKey(email), '1');
      localStorage.setItem('last_biometric_email', email);
      localStorage.setItem('biometric_any_enabled','1');
      alert('✅ Face ID / Fingerprint enabled! Next time tap the biometric button to login instantly.');
      updateBiometricUI();
    }
  }catch(e){
    console.log('biometric register error', e);
    if(e.name==='NotAllowedError') alert('Biometric canceled or not allowed.');
    else if(e.name==='NotSupportedError') alert('Biometric not supported on this device.');
    else alert('Biometric setup failed: '+e.message);
  }
}

async function loginWithBiometric(){
  try{
    if(!isBiometricSupported()){
      alert('Biometric not supported here');
      return false;
    }
    var email=localStorage.getItem('last_biometric_email')||localStorage.getItem('last_email')||'';
    var credIdStr=localStorage.getItem(getBiometricKey(email))||localStorage.getItem('biometric_cred_global')||localStorage.getItem(getBiometricKey('global'));
    // Find any enabled biometric if specific not found
    if(!credIdStr){
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k && k.startsWith('biometric_cred_')){
          credIdStr=localStorage.getItem(k);
          email=k.replace('biometric_cred_','').replace(/_/g,'@');
          break;
        }
      }
    }
    if(!credIdStr){
      alert('No biometric enrolled yet. Please login with email first, then enable Face ID.');
      return false;
    }
    
    var challenge=new Uint8Array(32);
    window.crypto.getRandomValues(challenge);
    
    var allowCreds=[];
    try{
      var raw=atob(credIdStr);
      var arr=new Uint8Array(raw.length);
      for(var j=0;j<raw.length;j++) arr[j]=raw.charCodeAt(j);
      allowCreds=[{type:"public-key", id:arr, transports:["internal"]}];
    }catch(e){}
    
    var assertion=await navigator.credentials.get({

const ANALYTICS_BUCKET='lwcanalytics2026';
var _analyticsStart=Date.now();
var _analyticsSessionId=Math.random().toString(36).substring(2,10);
async function trackEvent(eventType, extra){
  try{
    var u=getUser(); var email=(u&&u.email)||'anonymous_'+(localStorage.getItem('anon_id')||'');
    if(!localStorage.getItem('anon_id')){ var aid='anon_'+Math.random().toString(36).substring(2,10); localStorage.setItem('anon_id', aid); email=aid; }
    var today=new Date().toISOString().split('T')[0];
    var payload={
      e:eventType,
      email:email,
      name: (u&&u.firstName)||localStorage.getItem('userName')||'Anonymous',
      time: new Date().toISOString(),
      session:_analyticsSessionId,
      url: location.href,
      extra: extra||'',
      userAgent: navigator.userAgent.substring(0,100)
    };
    // Store in daily aggregated key
    var dayKey='day_'+today;
    try{
      var r=await fetch('https://kvdb.io/'+ANALYTICS_BUCKET+'/'+dayKey+'?t='+Date.now(), {cache:'no-store'});
      var existing=[];
      if(r.ok){
        var t=await r.text();
        if(t && t.trim().startsWith('[')) existing=JSON.parse(t);
      }
      existing.push(payload);
      // Keep only last 500 per day to avoid size limit
      if(existing.length>500) existing=existing.slice(-500);
      await fetch('https://kvdb.io/'+ANALYTICS_BUCKET+'/'+dayKey, {method:'POST', body: JSON.stringify(existing)});
    }catch(e){}
    // Also store per-user weekly counter
    var userKey='user_'+email.replace(/[^a-zA-Z0-9]/g,'_')+'_'+today;
    try{
      var r2=await fetch('https://kvdb.io/'+ANALYTICS_BUCKET+'/'+userKey+'?t='+Date.now(), {cache:'no-store'});
      var count=0;
      if(r2.ok){
        var t2=await r2.text();
        if(t2 && !isNaN(parseInt(t2))) count=parseInt(t2);
      }
      await fetch('https://kvdb.io/'+ANALYTICS_BUCKET+'/'+userKey, {method:'POST', body: String(count+1)});
    }catch(e){}
  }catch(e){}
}

{day:359,title:'Day 359: Refuge in Trouble',ref:'1 John 4:19',text:'We love, because He first loved us.',reflection:'When the world feels shaky, run to your Refuge. God isn\'t distant in your trouble - He\'s a very present help, right now. Today, meditate on 1 John 4:19. Let this truth sink deep - God spoke this specifically for you, for this moment. What would change if you really believed 1 John 4:19 is true for you today? Take 2 minutes of silence and ask God to make His Word alive in your heart.',prayer:'Father, thank You for 1 John 4:19. Today I choose to trust that \'We love, because He first loved us.\' is true for me. Help me to live like it. In Jesus\' name, Amen.'},
{day:360,title:'Day 360: Rest for the Weary',ref:'Micah 6:8',text:'He has told you, O man, what is good; and what does Yahweh require of you but to do justice, to love lovingkindness, and to walk humbly with your God?',reflection:'You weren\'t meant to carry everything alone. Jesus invites you to exchange your heavy burden for His light one. Come to Him today. Today, meditate on Micah 6:8. Let this truth sink deep - God spoke this specifically for you, for this moment. What would change if you really believed Micah 6:8 is true for you today? Take 2 minutes of silence and ask God to make His Word alive in your heart.',prayer:'Father, thank You for Micah 6:8. Today I choose to trust that \'He has told you, O man, what is good; and what does Yahweh require of you but to do justice, to love lovingkindness, and to walk humbly with your God?\' is true for me. Help me to live like it. In Jesus\' name, Amen.'},
{day:361,title:'Day 361: Strength for Today',ref:'Philippians 4:13',text:'I can do all things through Him who strengthens me.',reflection:'God doesn\'t promise a life without challenges, but He promises strength for each one. Whatever you\'re facing today, His power is made perfect in your weakness. Today, meditate on Philippians 4:13. Let this truth sink deep - God spoke this specifically for you, for this moment. What would change if you really believed Philippians 4:13 is true for you today? Take 2 minutes of silence and ask God to make His Word alive in your heart.',prayer:'Father, thank You for Philippians 4:13. Today I choose to trust that \'I can do all things through Him who strengthens me.\' is true for me. Help me to live like it. In Jesus\' name, Amen.'},
{day:362,title:'Day 362: God\'s Perfect Plan',ref:'Jeremiah 29:11',text:'For I know the plans that I have for you, declares Yahweh, plans for peace and not for calamity, to give you a future and a hope.',reflection:'When life feels uncertain, remember God is writing a bigger story. Your current chapter isn\'t the end - His plans are for your good and His glory. Today, meditate on Jeremiah 29:11. Let this truth sink deep - God spoke this specifically for you, for this moment. What would change if you really believed Jeremiah 29:11 is true for you today? Take 2 minutes of silence and ask God to make His Word alive in your heart.',prayer:'Father, thank You for Jeremiah 29:11. Today I choose to trust that \'For I know the plans that I have for you, declares Yahweh, plans for peace and not for calamity, to give you a future and a hope.\' is true for me. Help me to live like it. In Jesus\' name, Amen.'},
{day:363,title:'Day 363: Unshakable Hope',ref:'Romans 8:28',text:'And we know that for those who love God all things work together for good, for those who are called according to His purpose.',reflection:'Hope isn\'t wishful thinking - it\'s confident expectation in God\'s promises. Anchor your heart in what He has said, not what you see. Today, meditate on Romans 8:28. Let this truth sink deep - God spoke this specifically for you, for this moment. What would change if you really believed Romans 8:28 is true for you today? Take 2 minutes of silence and ask God to make His Word alive in your heart.',prayer:'Father, thank You for Romans 8:28. Today I choose to trust that \'And we know that for those who love God all things work together for good, for those who are called according to His purpose.\' is true for me. Help me to live like it. In Jesus\' name, Amen.'},
{day:364,title:'Day 364: The Shepherd\'s Care',ref:'Psalm 23:1',text:'Yahweh is my shepherd, I shall not want.',reflection:'You are not forgotten or overlooked. The same God who shepherds stars shepherds you - personally, intentionally, lovingly. Today, meditate on Psalm 23:1. Let this truth sink deep - God spoke this specifically for you, for this moment. What would change if you really believed Psalm 23:1 is true for you today? Take 2 minutes of silence and ask God to make His Word alive in your heart.',prayer:'Father, thank You for Psalm 23:1. Today I choose to trust that \'Yahweh is my shepherd, I shall not want.\' is true for me. Help me to live like it. In Jesus\' name, Amen.'},
{day:365,title:'Day 365: Courage Over Fear',ref:'Isaiah 41:10',text:'Do not fear, for I am with you; do not anxiously look about you, for I am your God. I will strengthen you, surely I will help you.',reflection:'Fear tells you what might happen. Faith tells you who is with you. Choose courage today, not because you are strong, but because He is. Today, meditate on Isaiah 41:10. Let this truth sink deep - God spoke this specifically for you, for this moment. What would change if you really believed Isaiah 41:10 is true for you today? Take 2 minutes of silence and ask God to make His Word alive in your heart.',prayer:'Father, thank You for Isaiah 41:10. Today I choose to trust that \'Do not fear, for I am with you; do not anxiously look about you, for I am your God. I will strengthen you, surely I will help you.\' is true for me. Help me to live like it. In Jesus\' name, Amen.'},
{day:366,title:'Day 366: Trust Beyond Understanding',ref:'Joshua 1:9',text:'Have I not commanded you? Be strong and courageous! Do not be dismayed, for Yahweh your God will be with you wherever you go.',reflection:'You don\'t need to understand the path to trust the Guide. God sees the whole map when you only see the next step. Today, meditate on Joshua 1:9. Let this truth sink deep - God spoke this specifically for you, for this moment. What would change if you really believed Joshua 1:9 is true for you today? Take 2 minutes of silence and ask God to make His Word alive in your heart.',prayer:'Father, thank You for Joshua 1:9. Today I choose to trust that \'Have I not commanded you? Be strong and courageous! Do not be dismayed, for Yahweh your God will be with you wherever you go.\' is true for me. Help me to live like it. In Jesus\' name, Amen.'},

function getTodayStr(){return new Date().toISOString().slice(0,10);}
function getWeekId(date){var d=new Date(date); var day=d.getDay(); var diff=d.getDate()-day; var ws=new Date(d.setDate(diff)); return ws.toISOString().slice(0,10);}

function getDailyVerse(){
  var now=new Date();
  var start=new Date(now.getFullYear(),0,0);
  var diff=now-start;
  var day=Math.floor(diff/(1000*60*60*24));
  var idx=day % dailyVerses.length;
  return dailyVerses[idx];
}

const CLOUD_BUCKET='lwctrivia2026v4'; const CLOUD_KEY='scores';
async function syncCloud(name, pts){
  try{
    let cur={};
    try{
      let r=await fetch('https://kvdb.io/'+CLOUD_BUCKET+'/'+CLOUD_KEY+'?t='+Date.now(), {cache:'no-store'});
      if(r.ok){ let t=await r.text(); if(t && t.trim().startsWith('{')) cur=JSON.parse(t); }
    }catch(e){}
    try{
      let backup=JSON.parse(localStorage.getItem('cloud_backup')||'{}');
      for(var k in backup){ if(!cur[k] || backup[k]>cur[k]) cur[k]=backup[k]; }
    }catch(e){}
    cur[name]=(cur[name]||0)+pts;
    localStorage.setItem('cloud_backup', JSON.stringify(cur));
    try{
      await fetch('https://kvdb.io/'+CLOUD_BUCKET+'/'+CLOUD_KEY, {method:'POST', body: JSON.stringify(cur)});
    }catch(e){}
  }catch(e){}
}
async function loadCloud(){
  try{
    let r=await fetch('https://kvdb.io/'+CLOUD_BUCKET+'/'+CLOUD_KEY+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw 1;
    let t=await r.text();
    if(!t || !t.trim()) return JSON.parse(localStorage.getItem('cloud_backup')||'{}');
    let j=JSON.parse(t);
    try{
      let backup=JSON.parse(localStorage.getItem('cloud_backup')||'{}');
      for(var k in backup){ if(!j[k] || backup[k]>j[k]) j[k]=backup[k]; }
    }catch(e){}
    localStorage.setItem('cloud_backup', JSON.stringify(j));
    return j;
  }catch(e){
    try{ return JSON.parse(localStorage.getItem('cloud_backup')||'{}'); }catch(e2){ return {}; }
  }
}
async function refreshCloudBoard(){
  var st=document.getElementById('cloudStatus');

  var combined={};
  for(var k in cloud) combined[k]=cloud[k];
  for(var k in local){ if(!combined[k]||local[k]>combined[k]) combined[k]=local[k]; }
  var sorted=Object.entries(combined).sort(function(a,b){return b[1]-a[1];});

async function syncReadingToCloud(){

    var key='reading_'+email.replace(/[^a-zA-Z0-9]/g,'_');
    var data={};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && (k.startsWith('read_') || k.startsWith('chapter_read_') || k.startsWith('book_read_') || k.startsWith('year_day_'))){
        data[k]=localStorage.getItem(k);
      }

    var u=getUser(); var email=(u&&u.email)||'guest'; if(email=='guest') return;

    var t=await r.text();

      var cloudVal=cloudData[k];

        localStorage.setItem(k,'1');
        count++;

        if(bc && bc.innerHTML.length>100) {

        }
      }catch(e){}
    }
  }catch(e){ console.log('load reading failed', e); }
}

const CLOUD_FAV_BUCKET='lwc_fav_2026v5';
async function syncFavoritesToCloud(){
  try{
    var u=getUser(); var email=(u&&u.email)||'guest'; if(email=='guest') return;
    var key='fav_'+email.replace(/[^a-zA-Z0-9]/g,'_');
    var list=getFavorites();
    await fetch('https://kvdb.io/'+CLOUD_FAV_BUCKET+'/'+key, {method:'POST', body: JSON.stringify(list)});
  }catch(e){}
}
async function loadFavoritesFromCloud(){
  try{
    var u=getUser(); var email=(u&&u.email)||'guest'; if(email=='guest') return;
    var key='fav_'+email.replace(/[^a-zA-Z0-9]/g,'_');
    var r=await fetch('https://kvdb.io/'+CLOUD_FAV_BUCKET+'/'+key+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    var t=await r.text(); if(!t.trim().startsWith('[')) return;
    var cloudList=JSON.parse(t);
    var local=getFavorites();
    // merge
    var merged=[...local];
    cloudList.forEach(function(cf){
      if(!merged.some(lf=>lf.ref===cf.ref)){ merged.push(cf); }
    });
    if(merged.length!==local.length){
      localStorage.setItem('favorite_verses', JSON.stringify(merged));
    }
  }catch(e){}
}

  for(var i=1;i<=Math.min(30,366);i++){
    var read=localStorage.getItem('devotional_read_'+i)=='1';
    html+='<span style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:6px;font-size:11px;'+(read?'background:#10b981;color:#fff':'background:#f1f5f9;color:#64748b')+'">'+i+'</span>';
  }
  html+='<span style="font-size:11px;color:#94a3b8;margin-left:6px">... showing first 30 days</span>';
  return html;
}
function shareDevotional(){
  var dayNum=parseInt(localStorage.getItem('devotional_day')||Math.floor((new Date() - new Date(new Date().getFullYear(),0,0))/1000/60/60/24));
  var dev=DAILY_DEVOTIONALS[dayNum-1];
  if(!dev) return;
  var text='☀️ Daily Devotional - Day '+dev.day+': '+dev.title+'\n\n'+dev.ref+': "'+dev.text+'"\n\n'+dev.reflection.substring(0,200)+'...\n\nFrom Living Water Church App';
  if(navigator.share){ navigator.share({title:dev.title, text:text}); } else { navigator.clipboard.writeText(text); alert('Devotional copied!'); }
}

</script>
